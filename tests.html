<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairShare - Bookkeeper Verification Tests</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --primary: #1e3a8a;
      --success: #15803d;
      --success-bg: #ecfdf5;
      --success-border: #86efac;
      --fail: #b91c1c;
      --fail-bg: #fef2f2;
      --fail-border: #fca5a5;
      --code-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 32px;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 19px;
      color: var(--text-muted);
    }

    .status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 28px;
      font-weight: 700;
      font-size: 22px;
    }
    .status-banner.all-pass {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color: var(--success);
    }
    .status-banner.has-fail {
      background: var(--fail-bg);
      border: 2px solid var(--fail-border);
      color: var(--fail);
    }

    .btn-rerun {
      background: #ffffff;
      border: 2px solid currentColor;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-rerun:hover {
      background: rgba(0,0,0,0.04);
    }

    .suite-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .suite-header {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 18px;
    }
    .test-item:last-child {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      font-family: ui-monospace, "SF Mono", monospace;
    }
    .badge-pass {
      background: #dcfce7;
      color: #166534;
    }
    .badge-fail {
      background: #fee2e2;
      color: #991b1b;
    }

    .test-details {
      flex: 1;
    }
    .test-name {
      font-weight: 600;
      color: var(--text);
    }
    .test-desc {
      color: var(--text-muted);
      font-size: 16px;
      margin-top: 3px;
    }
    .test-error {
      margin-top: 8px;
      padding: 10px;
      background: #fef2f2;
      border-left: 4px solid var(--fail);
      color: var(--fail);
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 15px;
      border-radius: 4px;
    }

    .math-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-top: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 17px;
      line-height: 1.6;
    }

    .highlight-pass {
      color: var(--success);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="nav-link">&larr; Back to FairShare App</a>
      <h1>FairShare Verification Suite</h1>
      <p class="subtitle">Automated tests verifying whole-cent money math, leftover cent distribution, and exact settlement reconciliation.</p>
    </header>

    <div id="status-banner" class="status-banner">
      <span id="summary-text">Running tests...</span>
      <button class="btn-rerun" onclick="runAllTests()">Re-run Tests</button>
    </div>

    <div id="test-results"></div>
  </div>

  <!-- Load pure money math and FairShare importer -->
  <script src="money.js"></script>
  <script src="importer.js"></script>

  <script>
    const testSuites = [];

    function suite(name, fn) {
      testSuites.push({ name, fn });
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || 'Assertion failed');
      }
    }

    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(`${message || 'Failed'}: Expected [${expected}] but got [${actual}]`);
      }
    }

    function assertDeepEqual(actual, expected, message) {
      const a = JSON.stringify(actual);
      const e = JSON.stringify(expected);
      if (a !== e) {
        throw new Error(`${message || 'Failed'}: Expected ${e} but got ${a}`);
      }
    }
  </script>

  <!-- Load Importer Test Suite -->
  <script src="tests.js"></script>

  <script>
    // --- TEST RUNNER ---


    function runAllTests() {
      const resultsContainer = document.getElementById('test-results');
      const statusBanner = document.getElementById('status-banner');
      const summaryText = document.getElementById('summary-text');

      resultsContainer.innerHTML = '';

      let totalTests = 0;
      let passedTests = 0;
      let failedTests = 0;

      for (const s of testSuites) {
        const suiteCard = document.createElement('div');
        suiteCard.className = 'suite-card';

        const suiteHeader = document.createElement('div');
        suiteHeader.className = 'suite-header';
        suiteHeader.innerHTML = `<span>${s.name}</span>`;
        suiteCard.appendChild(suiteHeader);

        const tests = [];
        s.fn((testName, fn) => {
          tests.push({ testName, fn });
        });

        for (const t of tests) {
          totalTests++;
          const item = document.createElement('div');
          item.className = 'test-item';

          let passed = false;
          let errorMsg = '';

          try {
            t.fn();
            passed = true;
            passedTests++;
          } catch (err) {
            passed = false;
            failedTests++;
            errorMsg = err.message || String(err);
          }

          const badge = document.createElement('span');
          badge.className = `badge ${passed ? 'badge-pass' : 'badge-fail'}`;
          badge.textContent = passed ? 'PASS' : 'FAIL';

          const details = document.createElement('div');
          details.className = 'test-details';

          const nameEl = document.createElement('div');
          nameEl.className = 'test-name';
          nameEl.textContent = t.testName;
          details.appendChild(nameEl);

          if (!passed) {
            const errEl = document.createElement('div');
            errEl.className = 'test-error';
            errEl.textContent = errorMsg;
            details.appendChild(errEl);
          }

          // Special highlight for the primary prompt requirement
          if (t.testName.includes('Shares add up to exactly $100.00')) {
            const mathBox = document.createElement('div');
            mathBox.className = 'math-box';
            mathBox.innerHTML = `
              <strong>Primary Prompt Check:</strong><br>
              Linda's share: $33.34 (3,334¢)<br>
              Dave's share: &nbsp;$33.33 (3,333¢)<br>
              Carol's share: $33.33 (3,333¢)<br>
              ----------------------------------<br>
              Total Sum: &nbsp; &nbsp; <span class="highlight-pass">$100.00 (10,000¢) &check; Exact Match</span>
            `;
            details.appendChild(mathBox);
          }

          item.appendChild(badge);
          item.appendChild(details);
          suiteCard.appendChild(item);
        }

        resultsContainer.appendChild(suiteCard);
      }

      if (failedTests === 0) {
        statusBanner.className = 'status-banner all-pass';
        summaryText.innerHTML = `&check; All ${passedTests} Tests Passed! ($100 split 3 ways adds up to exactly $100.00)`;
      } else {
        statusBanner.className = 'status-banner has-fail';
        summaryText.innerHTML = `✕ ${failedTests} of ${totalTests} Tests Failed`;
      }
    }

    // Run automatically on page load
    window.addEventListener('DOMContentLoaded', runAllTests);
  </script>
</body>
</html>
